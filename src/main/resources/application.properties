spring.application.name=crane-monitoring-ui
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/crane_monitoring}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Disabled by default so the Java application can run without local ML artifacts.
# Set the variables below to enable CNN-LSTM inference.
crane.neural.enabled=${CRANE_NEURAL_ENABLED:false}
crane.neural.python=${CRANE_NEURAL_PYTHON:disabled}
crane.neural.model-dir=${CRANE_NEURAL_MODEL_DIR:ml/models}
crane.neural.timeout-seconds=${CRANE_NEURAL_TIMEOUT_SECONDS:30}
crane.neural.backfill-on-startup=${CRANE_NEURAL_BACKFILL_ON_STARTUP:false}

crane.report.font-path=${CRANE_REPORT_FONT:}
crane.report.bold-font-path=${CRANE_REPORT_BOLD_FONT:}
