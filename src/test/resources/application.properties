spring.datasource.url=jdbc:h2:mem:crane_monitoring;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
crane.neural.enabled=false
crane.neural.python=disabled
crane.neural.model-dir=disabled
crane.neural.backfill-on-startup=false
